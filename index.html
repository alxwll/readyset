<style>
/* Hidden overlays (exercise sheet, player) must stay hidden even though they use display:flex */
.sheet-bg[hidden],.player[hidden],.pwrap[hidden],*[hidden]{display:none !important}
/* Layout: one narrow column like a phone app; condensed scoreboard type for names and counts, lilac figures on a lilac-tinted ground */
:root{
  --bg:#F5F1FA; --surface:#FFFFFF; --surface-2:#ECE5F6; --ink:#21182F; --muted:#6B6080; --line:#DED4EC;
  --lilac:#8E6BD1; --accent:#5A3D9A; --on-accent:#FFFFFF; --signal:#E2602F; --ok:#2C8A57;
  --fig:#2A1F3D; --fig-far:#BBA8DE; --ground:#C9B9E6; --go-dot:#D2BEFB;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#130F1B; --surface:#1D1729; --surface-2:#282038; --ink:#EFE9F8; --muted:#A99EBD; --line:#352B48;
  --lilac:#B59AF0; --accent:#C6AEF8; --on-accent:#1A1325; --signal:#FF8C5C; --ok:#5CC48A;
  --fig:#EFE9F8; --fig-far:#6A5794; --ground:#45385E; --go-dot:#6B4BB0; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#130F1B; --surface:#1D1729; --surface-2:#282038; --ink:#EFE9F8; --muted:#A99EBD; --line:#352B48;
  --lilac:#B59AF0; --accent:#C6AEF8; --on-accent:#1A1325; --signal:#FF8C5C; --ok:#5CC48A;
  --fig:#EFE9F8; --fig-far:#6A5794; --ground:#45385E; --go-dot:#6B4BB0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.app{max-width:580px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:22px}
.stack.tight{gap:12px}

header.top{display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.wm-head{display:flex;flex-direction:column;gap:2px}
.wm-switch{display:flex;align-items:baseline;gap:.45em;flex-wrap:nowrap;font-size:clamp(36px,12vw,48px)}
.wm-switch button{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:.08em;font-family:var(--display);font-weight:900;font-size:inherit;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--fig-far);transition:color .2s}
.wm-switch button i{display:inline-block;width:.2em;height:.2em;border-radius:50%;box-sizing:border-box;border:.05em solid currentColor;transition:all .2s}
.wm-switch button[aria-pressed="true"]{color:var(--ink);cursor:default}
.wm-switch button[aria-pressed="true"] i{background:var(--lilac);border-color:var(--lilac)}
.wm-switch button[aria-pressed="false"]:hover{color:var(--lilac)}
.wm-switch button:focus-visible{outline:3px solid var(--lilac);outline-offset:4px;border-radius:6px}
.rdot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:currentColor;margin-left:.06em;vertical-align:baseline}
.brand .rdot{background:var(--lilac)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.tabs button{border:0;background:transparent;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .08)}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:0}

/* hero / WOD */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.hero-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.hero-top > div{min-width:0}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(42px,11vw,62px);line-height:.9;margin:6px 0 10px;text-transform:uppercase;letter-spacing:.01em;hyphens:auto;overflow-wrap:break-word;text-wrap:balance}
.hero .meta{color:var(--muted);font-size:14px;margin:0;font-variant-numeric:tabular-nums}
.hero-fig{aspect-ratio:1.1;max-width:100%;background:var(--surface-2);border-radius:16px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero-actions .btn:first-child{flex:1 1 180px;justify-content:center}
@media (max-width:420px){.hero-top{grid-template-columns:1fr}.hero-fig{order:-1;aspect-ratio:1.7}}

.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;gap:8px}
.rdot.go-dot{background:var(--go-dot)}
.btn.go{align-items:baseline;gap:0;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.03em;text-transform:uppercase;padding-block:9px}
.btn.small.go{font-size:19px;padding:5px 16px}
.p-main .rdot.go-dot{background:var(--go-dot)}
.p-main.alt .rdot.go-dot{background:var(--lilac)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost[aria-pressed="true"]{border-color:var(--lilac);color:var(--accent)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.dot{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.dot.on{background:var(--lilac)}
.dot.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--surface)}
.day.today{color:var(--ink)}
.day.today .dot{box-shadow:0 0 0 2px var(--accent)}

/* controls */
.field{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:440px){.seg.four{grid-template-columns:repeat(2,1fr)}}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.2;text-align:center}
.seg button small{font-weight:500;font-size:11px;opacity:.85;margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.range-row{display:flex;align-items:center;gap:14px}
.range-row input{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.range-val{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1.5px solid transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chip b{color:var(--accent);font-weight:700}
button.chip:hover:not(:disabled){border-color:var(--line)}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--lilac);color:var(--accent)}
.chip:disabled{opacity:.55}
.chip.band-chip{display:inline-flex;align-items:center;gap:6px;padding-left:8px}
.chip.band-chip i{width:14px;height:14px;border-radius:50%;display:block;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15)}
.chip small{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:4px;color:var(--muted)}

/* workout cards */
.wlist{display:flex;flex-direction:column;gap:12px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.wcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wcard-head > div{min-width:0}
.wname{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;text-transform:uppercase}
.wfocus{color:var(--muted);font-size:14px;margin-top:4px}
.wfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.best{color:var(--ink);font-weight:600}
.extlink{align-self:flex-start;display:inline-block;margin-top:2px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.linkbtn{border:0;background:none;padding:0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* generated result */
.result{scroll-margin-top:84px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.result .wname{font-size:40px}
.items{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item-row{display:flex;align-items:stretch;gap:4px;border-bottom:1px solid var(--line)}
.item-row .item{border-bottom:0;flex:1;min-width:0}
.swap-btn{flex:none;width:40px;border:0;background:none;color:var(--muted);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.swap-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.swap-btn[aria-expanded="true"]{background:var(--surface-2);color:var(--accent)}
.swap-btn:focus-visible{outline:3px solid var(--lilac)}
.swap-panel{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:6px 0 8px}
.swap-panel .item{border-bottom:1px solid var(--line)}
.swap-panel .item:last-of-type{border-bottom:0}
.swap-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.item{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);border-left:0;border-right:0;border-top:0;background:none;text-align:left;width:100%}
.item .mini{width:64px;height:56px;flex:none;background:var(--surface-2);border-radius:10px}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.item .txt b{font-size:15px}
.item .txt span{font-size:12px;color:var(--muted)}
.item .amt{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.format{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px}

/* library */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.excard:hover{border-color:var(--lilac)}
.excard .figbox{background:var(--surface-2);border-radius:11px;aspect-ratio:1.15}
.excard .n{font-weight:700;font-size:15px;line-height:1.2}
.excard .m{font-size:12px;color:var(--muted);line-height:1.3}

/* figure */
svg.fig{display:block;width:100%;height:100%}
.f-ground{stroke:var(--ground);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 7}
.f-limb,.f-torso{fill:none;stroke:var(--fig);stroke-linecap:round;stroke-linejoin:round;stroke-width:8}
.f-limb.far{stroke:var(--fig-far)}
.f-toe{fill:none;stroke:var(--fig);stroke-linecap:round;stroke-width:6}.f-toe.far{stroke:var(--fig-far)}
.f-torso{stroke-width:11}
.f-torso.wide{stroke-width:21}
.f-head{fill:var(--fig)}
.gear{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 0;font-size:14px;font-weight:600;color:var(--ink)}
.gear-ic{width:18px;height:18px;flex:none;fill:none;stroke:var(--lilac);stroke-width:2.6;stroke-linecap:round}
.eq-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.eq-tile{border:1.5px solid transparent;background:var(--surface-2);border-radius:14px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font:inherit;cursor:pointer}
.eq-tile svg{width:30px;height:30px}
.eq-tile span{font-size:12px;line-height:1.1;text-align:center}
.eq-tile[aria-pressed="true"]{background:var(--surface);border-color:var(--lilac);color:var(--ink)}
.eq-tile .i{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.eq-tile .a{fill:var(--lilac);opacity:.35}
.eq-tile .s{fill:none;stroke:var(--lilac);stroke-width:4;stroke-linecap:round;opacity:.35}
.eq-tile .w{fill:none;stroke:var(--surface-2);stroke-width:2;stroke-linecap:round}
.eq-tile[aria-pressed="true"] .a,.eq-tile[aria-pressed="true"] .s{opacity:1}
.eq-tile[aria-pressed="true"] .w{stroke:var(--surface)}
.eq-tile:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.eq-mini{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.eq-tile.mini{padding:6px 0;border-radius:11px;aspect-ratio:1}
.eq-tile.mini svg{width:24px;height:24px}
.eq-filter-note{margin:2px 0 0}
.eq-filter-note b{color:var(--ink)}
.hero-actions.one-line{display:flex;flex-wrap:nowrap;align-items:stretch;gap:8px}
.hero-actions.one-line .btn.go{flex:1;min-width:0}
.seg.pics{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:7px;background:none;padding:0}
.seg.pics .pic-tile{border:1.5px solid transparent;box-shadow:none;background:var(--surface-2);border-radius:14px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font:inherit;cursor:pointer;text-align:center}
.seg.pics .pic-tile[aria-pressed="true"]{box-shadow:none;background:var(--surface);border-color:var(--lilac);color:var(--ink)}
.pic-tile:focus-visible,.toggle-row:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.pic-tile .pl1{font-size:14px;font-weight:700;line-height:1.15}
.seg.pics[style*="--cols:4"] .pic-tile .pl1{font-size:12px;letter-spacing:-.01em}
.seg.pics[style*="--cols:4"] .pic-tile{padding:10px 1px 9px}
.pic-tile small{font-size:11px;line-height:1.3;opacity:.9}
.pic-tile svg{width:34px;height:40px}
.seg.lv .pic-tile svg{width:30px;height:24px;margin:6px 0 4px}
.pic-tile svg .d,.pic-tile svg .h{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.pic-tile svg .d{stroke:var(--fig-far);opacity:.55}.pic-tile svg .df{fill:var(--fig-far);opacity:.55}
.pic-tile svg .h{stroke:var(--accent)}.pic-tile svg .hf{fill:var(--accent)}
.pic-tile svg .core{stroke-width:6}
.pic-tile svg .i{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pic-tile svg .p{fill:var(--lilac)}
.pic-tile svg .pl{fill:none;stroke:var(--lilac);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pic-tile svg .bf{fill:var(--accent)}.pic-tile svg .be{fill:var(--fig-far);opacity:.45}
.pic-tile[aria-pressed="false"] svg .h{stroke:var(--muted)}.pic-tile[aria-pressed="false"] svg .hf{fill:var(--muted)}.pic-tile[aria-pressed="false"] svg .bf{fill:var(--muted)}
.toggle-row{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid transparent;background:var(--surface-2);border-radius:14px;padding:10px 12px;margin-bottom:7px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.toggle-row svg{width:30px;height:30px;flex:none}
.toggle-row svg .i{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.toggle-row svg .a2{fill:var(--lilac)}
.toggle-row .tr-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.toggle-row .tr-txt b{font-size:15px}
.toggle-row .tr-txt small{font-size:12px;color:var(--muted);line-height:1.3}
.toggle-row .sw{width:44px;height:26px;border-radius:13px;background:var(--fig-far);position:relative;flex:none;transition:background .2s}
.toggle-row .sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.toggle-row[aria-checked="true"] .sw{background:var(--accent)}
.toggle-row[aria-checked="true"] .sw::after{left:21px}
.backup{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.backup h3{margin:0;font-size:17px}
.bk-row{display:flex;gap:8px;flex-wrap:wrap}
.bk-text{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.vary-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.vary-head .range-val{font-family:var(--body);font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;min-width:0}
.vary-pic{--vc0:#5A3D9A;--vc1:#8E6BD1;--vc2:#BBA8DE;--vc3:#3E2A70;display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 0 4px;min-height:52px;align-items:center}
.vary-pic .vb{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--fig-far);border-radius:9px;padding:6px 8px}
.vary-pic .vb i{width:9px;height:9px;border-radius:50%;display:block}
.vary-pic .vb b{font-family:var(--display);font-weight:900;font-size:17px;line-height:1;color:var(--accent);margin-left:3px}
.vary-pic.once{gap:8px}.vary-pic.once .vb{border-color:transparent;padding:2px 0}
.vary-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
#vary{width:100%;accent-color:var(--accent);height:28px;touch-action:pan-y}
.range-row input{touch-action:pan-y}
.peek{display:flex;align-items:center;gap:12px;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.peek:hover{border-color:var(--lilac)}
.peek .faces{display:flex;flex:none}
.peek .face{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:2px solid var(--bg);margin-left:-10px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.peek .face:first-child{margin-left:0}
.peek .face svg{width:100%;height:100%}
.peek .more{font-size:12px;font-weight:700;color:var(--muted)}
.peek .lbl{flex:1;font-weight:700;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek .chev{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);flex:none}
.sheet.wsheet{padding-bottom:0}
.wsheet .ws-head h3{font-family:var(--display);font-weight:900;font-size:34px;line-height:.95;margin:4px 0 6px;text-transform:uppercase}
.wsheet .ws-meta{color:var(--muted);font-size:14px;margin:0}
.ws-foot{position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(16px + env(safe-area-inset-bottom, 0px));margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.ws-foot .btn.go{width:100%;justify-content:center}
.ws-save{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.icon-btn{flex:none;width:64px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;cursor:pointer;padding:6px 0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn svg .dot{fill:currentColor;stroke:none}
.icon-btn span{font-size:11px;color:var(--muted)}
.icon-btn:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.emph-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.emph-row select{flex:1;max-width:220px;border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;font:inherit;font-size:15px;background:var(--surface);color:var(--ink)}
.eq-sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.eq-sheet{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px 14px 10px;margin-top:10px}
.eq-top{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.eq-grp{border-top:1px solid var(--line)}
.eq-grp summary{display:flex;justify-content:space-between;align-items:center;padding:11px 0;cursor:pointer;font-weight:600;font-size:15px;list-style:none}
.eq-grp summary::-webkit-details-marker{display:none}
.eq-grp summary span{font-size:13px;font-weight:400;color:var(--muted)}
.eq-grp .chips{padding-bottom:12px}
.lib-count{margin:6px 0 -2px;font-size:15px;color:var(--muted)}
.lib-count b{font-family:var(--display);font-weight:900;font-size:22px;color:var(--ink);letter-spacing:.02em;margin-right:2px}
.f-mat{fill:var(--surface);stroke:var(--line);stroke-width:1.5}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.hlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow > div{min-width:0}
.hrow .t1{font-weight:700}
.hrow .t2{font-size:13px;color:var(--muted)}
.hrow .time{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--accent);vertical-align:2px;margin-left:6px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(10 6 18 / .5);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--surface);width:100%;max-width:580px;border-radius:24px 24px 0 0;padding:16px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3{font-family:var(--display);font-weight:900;font-size:40px;text-transform:uppercase;margin:0;line-height:1}
.sheet .figbox{background:var(--surface-2);border-radius:16px;aspect-ratio:1.4;max-width:100%}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.easier{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-line}

/* player */
.player{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;
  padding:calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.pwrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-top .btn{min-width:96px;justify-content:center}
.p-clock{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.p-bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.p-bar i{display:block;height:100%;width:0;background:var(--signal);transition:width .3s}
.p-meta{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.p-stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;aspect-ratio:1.25;max-width:100%;position:relative;overflow:hidden}
.p-stage.dim .fig{opacity:.45}
.nofig{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:15px}
.item .mini.nofig-mini{display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;line-height:1.2;padding:4px}
/* device pairing */
.pair-entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;color:var(--ink);font:inherit;cursor:pointer;margin-top:6px}
.pair-entry .pic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.pair-entry svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pair-entry .t{flex:1;min-width:0}.pair-entry b{display:block;font-size:16px}.pair-entry small{color:var(--muted);font-size:13px}
.pair-entry .chev{color:var(--muted);font-size:22px}
.pair .lede-s{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.pair-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pair-card .note{margin:0}
.pair-qr{width:220px;max-width:72%;margin:4px auto;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;line-height:0}
.pair-qr svg{width:100%;height:auto}
.pair-code{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;text-align:center;background:var(--surface-2);color:var(--accent);border-radius:14px;padding:12px 8px;letter-spacing:.02em;overflow-wrap:anywhere;user-select:all}
.pair-input{width:100%;box-sizing:border-box;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;border:2px solid var(--accent);border-radius:14px;padding:12px;background:var(--surface);color:var(--ink)}
.pair-input::placeholder{color:var(--line)}
.pair-video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#000}
.pair-state{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.pair-state i{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.pair-state.bad i{background:var(--signal)}
.pair-state.busy i{background:var(--lilac);animation:think 1.2s infinite ease-in-out}
.pair-dev{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.pair-dev:nth-child(2){border-top:0}.pair-dev span{color:var(--muted);text-align:right}
.pair-actions{display:flex;flex-direction:column;gap:8px}
.pair-actions .btn,.pair-card .btn{justify-content:center}
.btn.danger{color:var(--signal)}
.linkback{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;padding:4px 0;align-self:flex-start;cursor:pointer}
.pair .btn .think{display:inline-flex;gap:4px;margin-left:8px}
.pair .btn .think i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:think 1.2s infinite ease-in-out}
.pair .btn .think i:nth-child(2){animation-delay:.15s}.pair .btn .think i:nth-child(3){animation-delay:.3s}
/* text generator while the AI works */
.imp-busy textarea.imp{opacity:.5;cursor:progress}
#imp-go[aria-busy="true"]{background:var(--surface-2);color:var(--accent);opacity:1;cursor:progress;gap:0}
#imp-go[aria-busy="true"]{flex:1;white-space:nowrap;justify-content:center;padding-left:14px;padding-right:14px}
.imp-busy #imp-stop{flex:none}
.imp-x{width:52px;height:52px;padding:0;border-radius:50%;justify-content:center;flex:none}
.imp-x svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.imp-busy .hero-actions{flex-wrap:nowrap}
#imp-go .think{display:inline-flex;gap:4px;margin:0 10px 0 8px}
#imp-go .think i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:think 1.2s infinite ease-in-out}
#imp-go .think i:nth-child(2){animation-delay:.15s} #imp-go .think i:nth-child(3){animation-delay:.3s}
#imp-go .secs{font-variant-numeric:tabular-nums;font-weight:500;opacity:.75;min-width:2.4em;text-align:left}
@keyframes think{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){#imp-go .think i{animation:none;opacity:.7}}
textarea.imp{width:100%;min-height:180px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;padding:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-right:4px}
.badge.ok{background:var(--surface-2);color:var(--ok)}
.badge.sim{background:var(--surface-2);color:var(--accent)}
.badge.no{background:var(--surface-2);color:var(--signal)}
.mode{grid-template-columns:repeat(2,1fr)}
.p-ring{position:absolute;inset:auto 12px 12px auto;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.p-label{font-family:var(--display);font-weight:900;font-size:clamp(36px,10vw,52px);text-transform:uppercase;text-align:center;line-height:1;margin-top:6px}
.p-count{font-family:var(--display);font-weight:900;font-size:clamp(84px,26vw,132px);text-align:center;line-height:.9;font-variant-numeric:tabular-nums;color:var(--accent)}
.p-count.rest{color:var(--signal)}
.p-count.editable{cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.p-count.editable:not(.editing) .rep-v{text-decoration:underline dotted 3px var(--fig-far);text-underline-offset:10px}
.p-count .rep-row{display:inline-flex;align-items:center;gap:18px}
.p-count .rep-b{width:54px;height:54px;border-radius:50%;border:0;background:var(--surface-2);color:var(--accent);font-size:30px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;font-family:var(--body)}
.p-count .rep-h{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-top:6px;letter-spacing:0}
.player.rep-editing .p-hint,.player.rep-editing .p-guide{display:none}
.player.rep-editing .p-count{font-size:clamp(68px,20vw,96px)}
.player.rep-editing .p-count .rep-h{margin-top:2px}
.sheet-load{background:var(--surface-2);border-radius:14px;padding:4px 12px;display:flex;flex-direction:column;gap:6px}
.sheet-load:has(.chips),.sheet-load:has(.tune-load){padding-bottom:12px}
.sl-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:8px 0;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;text-align:left}
.sl-head>span{font-weight:600}
.sl-head b{color:var(--ink);font-weight:700}.sl-head .sl-none{color:var(--accent);font-weight:600}
.sl-head svg{width:18px;height:18px;margin-left:auto;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet-load .chip{background:var(--surface);border-color:var(--line)}
.sheet-load .chip[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:#fff}
#bsheet{z-index:70}
.bands-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;margin-top:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.bands-line i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15)}
.bands-line .bl-names{font-weight:400;font-size:12px;color:var(--muted);flex:1 1 100%;order:3}
.bands-line svg{width:16px;height:16px;margin-left:auto;fill:none;stroke:var(--muted);stroke-width:2}
.bs-h{font-size:32px!important}
.bs-seg{grid-template-columns:1fr 1fr}
.bs-list{display:flex;flex-direction:column;gap:6px}
.bs-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.bs-row span{flex:1;font-weight:600}
.bdot{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15)}
.bs-ar,.bs-x{width:34px;height:34px;border-radius:9px;border:0;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bs-x{background:none;color:var(--muted)}
.bs-ar:disabled{opacity:.3;cursor:default}
.bs-ar svg,.bs-x svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.band-tip{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--accent);margin:2px 0 4px}
.chips .linkbtn{align-self:center;margin-left:4px}
.tune-done{font-size:12px;color:var(--accent);margin:2px 0}
.p-hint{text-align:center;color:var(--muted);font-size:14px;min-height:21px;text-wrap:balance}
.p-hint b{color:var(--ink)}
.p-guide{align-self:center}
.p-main{border:0;border-radius:18px;padding:18px;font-size:20px;font-weight:700;background:var(--accent);color:var(--on-accent);width:100%}
.p-main.alt{background:var(--surface-2);color:var(--ink)}
.p-next{text-align:center;font-size:14px;color:var(--muted)}
.p-next b{color:var(--ink)}
/* Pauses get their own look: dark lilac. Timed pauses show a ring and a large but faded preview; the gate between blocks has no clock at all */
.player.mode-rest,.player.mode-gate{background:#2E2560;color:#fff;--ink:#fff;--muted:#CBC2E6;--surface-2:rgba(255,255,255,.12);--line:rgba(255,255,255,.18)}
.player.mode-rest .p-clock,.player.mode-gate .p-clock{opacity:.6}
.player.mode-rest .p-bar,.player.mode-gate .p-bar{background:rgba(255,255,255,.14)}
.player.mode-rest .btn.ghost,.player.mode-gate .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35);background:transparent}
.player.mode-rest .p-stage,.player.mode-gate .p-stage{background:#ECE5F6;border-color:transparent;--fig:#2A1F3D;--fig-far:#BBA8DE;--ground:#C9B9E6}
.player.mode-rest .p-ring,.player.mode-gate .p-ring{color:#6B6080}
.player.mode-gate .p-stage.dim .fig{opacity:.5}
.mode-rest .p-meta{order:1}.mode-rest .p-top{order:0}.mode-rest .p-bar{order:0}
.mode-rest .p-count{order:2;align-self:center;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:38px;color:#fff;
  background:radial-gradient(closest-side,#2E2560 80%,transparent 82%),conic-gradient(#B59AF0 calc(var(--p,1)*360deg),rgba(255,255,255,.16) 0)}
.mode-rest .p-label{order:3;font-size:18px;letter-spacing:.14em;margin-top:0;color:#E6DCF7}
.mode-rest .p-stage{order:4}
.mode-rest .p-next{order:5;font-size:17px;color:#fff}.mode-rest .p-next b{color:#fff}
.mode-rest .p-load{order:6}.mode-rest .p-hint{order:7}.mode-rest .p-guide{order:8}.mode-rest .p-main{order:9}
.mode-gate .p-load{display:none!important}
/* Weight or band colour as a clear badge, during the exercise and as "bereitlegen" before it */
.p-load{font:inherit;cursor:pointer;align-self:center;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px 8px 10px;font-size:17px;font-weight:700;background:var(--surface);color:var(--ink);border:2px solid var(--lilac)}
.p-load i{width:18px;height:18px;border-radius:50%;display:block;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15)}
.p-load svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round}
.mode-rest .p-load{background:#fff;color:#21182F}
.p-load.add,.player.has-load .p-load.add{border:0;background:rgba(142,107,209,.12);color:#6B5A93;font-size:14px;font-weight:600;padding:6px 13px}
.mode-rest .p-load.add{background:rgba(255,255,255,.12);color:#E6DCF7}
.p-load .pen{width:15px;height:15px;stroke:var(--muted);stroke-width:2}
/* top left: the figure may show a grip badge in the top right corner */
.p-ban{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer}
.p-ban svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-ban[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.mode-rest .p-ban,.mode-gate .p-ban{background:#fff;color:#6B6080}.mode-rest .p-ban[aria-pressed="true"],.mode-gate .p-ban[aria-pressed="true"]{background:#5A3D9A;color:#fff}
.p-toast{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#21182F;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px}
.p-toast button{border:0;background:none;color:#D2BEFB;font-weight:700;padding:0;cursor:pointer}
.p-loadedit{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.mode-rest .p-loadedit{background:#fff;color:#21182F;border-color:transparent;--muted:#6B6080;--line:#DED4EC;--surface:#fff;--ink:#21182F}
.p-loadedit b{font-size:15px}
.p-loadedit .kg{display:flex;align-items:center;gap:8px}
.p-loadedit input{width:110px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:20px;background:var(--surface);color:var(--ink)}
.p-loadedit .chips .chip{background:#fff;border-color:#DED4EC;color:#21182F}
.p-loadedit .chips .chip[aria-pressed="true"]{background:#8E6BD1;border-color:#8E6BD1;color:#fff}
.mode-rest .p-loadedit{order:6}
.tune-ban{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.tune-ban svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tune-ban[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tune-bannote{font-size:12px;color:var(--muted)}
.bans{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.bans summary{cursor:pointer;font-weight:600;padding:10px 0}
.bans .brow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.bans .brow .mini{width:48px;height:42px;background:var(--surface-2);border-radius:9px;flex:none;overflow:hidden}
.bans .brow .mini svg{width:100%;height:100%}
.bans .brow span{flex:1;font-weight:600;font-size:15px}
.player:not(.mode-rest):not(.mode-gate) .p-stage{max-height:max(150px,calc(100dvh - 520px))}
/* with a badge the work screen gets a slightly flatter stage and number so everything still fits without scrolling */
/* with a weight badge the stage keeps the same calm proportions; only on short screens the number shrinks a little */
.player.has-load .p-load{padding:6px 14px 6px 9px;font-size:16px}
.player.has-load .pwrap{gap:8px}
@media (max-height:760px){.player.has-load .p-count{font-size:clamp(72px,22vw,112px)}}
.mode-rest .p-stage.dim .fig{opacity:.5}
.mode-gate .p-count{display:none}
.mode-ready .p-main{background:#B59AF0;color:#1E1736}
.mode-gate .p-top{order:0}.mode-gate .p-bar{order:0}.mode-gate .p-meta{order:1}
.mode-gate .p-gateicon{display:block!important;order:2;align-self:center;margin-top:10px}
.mode-gate .p-label{order:3;font-size:clamp(32px,9vw,44px)}
.mode-gate .p-hint{order:4;color:#E6DCF7;font-size:15px}
.mode-gate .p-stage{order:5;width:62%;align-self:center}
.mode-gate .p-next{order:6;color:#fff}.mode-gate .p-next b{color:#fff}
.mode-gate .p-guide{order:7}
.mode-gate .p-main{order:8;margin-top:auto;background:#B59AF0;color:#1E1736;font-size:22px;padding:20px}
.p-gateicon{display:none;width:44px;height:44px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:24px}
.done .big{font-family:var(--display);font-weight:900;font-size:clamp(88px,28vw,140px);line-height:.9;font-variant-numeric:tabular-nums}
.done h2{font-family:var(--display);font-weight:900;font-size:44px;text-transform:uppercase;margin:0;line-height:1}
.done .pb{background:var(--signal);color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;font-size:14px}
.done p{color:var(--muted);margin:0}
.done .btn{margin-top:14px;min-width:220px;justify-content:center}

.f-bar{stroke:var(--muted);stroke-width:6;stroke-linecap:round}
.f-prop{stroke:var(--signal);stroke-width:3;stroke-linecap:round;fill:none}
.f-loop{stroke:var(--signal);stroke-width:5;stroke-linecap:round;fill:none}
.f-ring{fill:none;stroke:var(--signal);stroke-width:4}
.f-anchor{fill:var(--muted)}
.f-grip-box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.f-grip-head{fill:var(--fig-far)}
.f-grip rect:not(.f-grip-box){fill:var(--lilac)}
.f-fist{fill:var(--fig);stroke:var(--surface-2);stroke-width:2.5}
.f-shadow{fill:var(--ground);opacity:.35}
.f-head.top{stroke:var(--halo,var(--surface-2));stroke-width:2.5}
#sheet-fig{position:relative}
#sheet-fig[data-view]:not([data-view=""])::after{content:attr(data-view);position:absolute;left:12px;bottom:10px;font-size:12px;font-weight:600;color:var(--muted)}
.f-halo{fill:none;stroke:var(--halo,var(--surface-2));stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.f-halo.ht{stroke-width:16}.f-halo.ht.wide{stroke-width:26}
.p-stage{--halo:var(--surface)}
.player.mode-rest .p-stage,.player.mode-gate .p-stage{--halo:#ECE5F6}
.f-fist.lil{fill:var(--lilac)}
.f-fist.back{fill:var(--fig-far)}
.f-db{fill:none;stroke:var(--signal);stroke-width:4.5;stroke-linecap:round}
.f-kb circle{fill:var(--signal)}
.f-kb.back{opacity:.5}
.f-kbh{fill:none;stroke:var(--signal);stroke-width:3}

const rad=d=>d*Math.PI/180;

const lerp=(a,b,u)=>a+(b-a)*u;
const lerp2=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u)];
function ik(root,target,l1,l2,s){
  let dx=target[0]-root[0], dy=target[1]-root[1]; let D=Math.hypot(dx,dy);
  if(D<1e-6){dx=0;dy=1;D=1;}
  const ux=dx/D, uy=dy/D;
  const d=Math.min(Math.max(D,Math.abs(l1-l2)+0.5),l1+l2-0.01);
  const a=Math.acos(Math.min(1,Math.max(-1,(l1*l1+d*d-l2*l2)/(2*l1*d))))*s;
  const c=Math.cos(a), sn=Math.sin(a);
  const j=[root[0]+l1*(ux*c-uy*sn), root[1]+l1*(ux*sn+uy*c)];
  const ex=target[0]-j[0], ey=target[1]-j[1]; const E=Math.hypot(ex,ey)||1;
  return [root,j,[j[0]+l2*ex/E, j[1]+l2*ey/E]];
}

function dragOnly(inp){if(!inp)return; let guard=false, start=inp.value;
  inp.addEventListener('pointerdown',e=>{const r=inp.getBoundingClientRect(), mn=+inp.min, mx=+inp.max, tw=26;
    const x=r.left+tw/2+(r.width-tw)*((+inp.value-mn)/(mx-mn||1)); start=inp.value; guard=Math.abs(e.clientX-x)>tw;},{capture:true});
  const block=e=>{if(guard){inp.value=start;e.stopImmediatePropagation();e.preventDefault&&e.preventDefault();}};
  inp.addEventListener('input',block,{capture:true}); inp.addEventListener('change',e=>{block(e);guard=false;},{capture:true});
  inp.addEventListener('pointerup',()=>setTimeout(()=>{guard=false;},0));}

function importPrompt(text){

2. "create": Der Text ist ein Wunsch oder eine Situation, z. B. "Erstelle mir eine Plank-Challenge" oder "Ich war gestern laufen, meine Beine sind müde". Stelle dann selbst ein passendes, sinnvolles Workout zusammen, ausschließlich mit Übungen aus dem Katalog (match immer "exact"). Berücksichtige Erschöpfung, Ziel und gewünschte Dauer aus dem Text. Erschöpfte Körperteile dürfen auch nicht nebenbei belastet werden: Bei müden Beinen (z. B. nach Laufen, Radfahren, Beintag) nur Übungen mit „Beine: keine“ wählen, höchstens eine mit „Beine: leicht“, niemals „Beine: stark“. Keine Sprünge, Mountain Climber, Burpees oder Übungen im Stand mit Beinarbeit. Bei anderen müden Körperteilen genauso: Prüfe die Muskeln jeder Übung, auch Stütz- und Haltearbeit (z. B. Planks belasten die Schultern). Ohne Angabe: etwa 20 Minuten, 4 bis 6 Übungen. Nutze bevorzugt dieses Equipment, außer der Text nennt anderes: ${eq}. Wähle keine Aufwärm- oder Dehnübungen, die ergänzt die App selbst, außer der Wunsch ist ausdrücklich eine Mobility- oder Dehn-Einheit. Schreibe in "note" einen kurzen, motivierenden Satz auf Deutsch, warum das Workout passt.

Katalog (key | Name | Bereich | Equipment | Muskeln | Beinbelastung):
${cat}

Regeln:
- match "exact": dieselbe Übung, Sprache egal (z. B. "Wadenheben" = calfraise, "Ausfallschritte im Gehen" = lunge).

Antworte nur mit JSON in genau dieser Form:

function buildImported(data){

    const ex=typeof x.ex==='string'&&EX[x.ex]?x.ex:null;
    const match=ex?(x.match==='exact'?'exact':'similar'):'none';
    const sec=num(x.sec,5,600,null), reps=sec?null:num(x.reps,1,300,10);
    return {name:String(x.name||'Übung').slice(0,60),ex,match,sets:num(x.sets,1,10,1),reps,sec,perSide:!!x.perSide,rest:num(x.rest,0,600,60),tip:String(x.tip||'').slice(0,160)};

function libKeys(){
  const q=normQ(libQuery.trim()), terms=q.split(/\s+/).filter(Boolean);
  const scored=[];
  Object.keys(EX).forEach(k=>{const e=EX[k];
    if(libFilter==='warmup'||libFilter==='stretch'){if(e.region!=='mobility'||!e.types.includes(libFilter==='warmup'?'warmup':'cooldown')) return;}

    if(libEquip!=='all'&&!(libEquip==='none'?!e.equip.length:usesOf(e).includes(libEquip))) return;
    if(!terms.length){scored.push([k,0]);return;}
    const name=normQ(e.name), alias=normQ((DE_ALIAS[k]||'')+(e.equip.length?'':' körpergewicht ohne equipment ohne geräte')), rest=normQ([e.muscles,EQ_LABEL[sourceOf(e)],REGION_LABEL[e.region],e.types.map(t=>TYPE_LABEL[t]).join(' ')].join(' '));
    let score=0;
    for(const t of terms){
      if(name.startsWith(t)) score+=4; else if(name.includes(t)) score+=3;
      else if(alias.includes(t)) score+=2; else if(rest.includes(t)) score+=1; else return;
    }
    scored.push([k,score]);
  });
  return scored.sort((a,b)=>b[1]-a[1]).map(x=>x[0]);

function beep(freq=880,dur=.12,vol=.55){try{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq;

function requestWake(){if(wake)return;try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{if(!P){l.release().catch(()=>{});return;}wake=l;l.addEventListener('release',()=>{if(wake===l)wake=null;});}).catch(()=>{});}catch(e){}}

/* ---- Fitness score ----
   What you actually manage, on one scale with the three levels (Leicht 0.6 · Standard 1.0 · Hart 1.4):

   Recent workouts count more; after more than two weeks without training the score sinks slowly. */
const LV_ORDER=['leicht','standard','hart'], ZONE_CUT=[.8,1.2], SC_MIN=.4, SC_MAX=1.8, SC_NEED=5, DAY=864e5;

const scoreable=s=>s&&s.type!=='stretch'&&!s.imp&&LEVELS[s.level]&&(s.ex||[]).some(k=>EX[k]&&EX[k].region!=='mobility'&&!EX[k].roll);

  if(list.length<SC_NEED)return {ready:false,count:list.length};

  let sw=0,sv=0; use.forEach(s=>{const c=sessCap(s); if(c==null)return; const w=Math.pow(.5,(now-s.at)/(14*DAY)); sw+=w; sv+=w*c;});

/* "Bereit für Hart": the score lay in another zone than the chosen level in the last 3 workouts on that level */
function levelHint(){

  if(list.length<SC_NEED||list.length<(DB.lvlSnooze||0))return null;

  box.querySelectorAll('[data-tfig]').forEach(n=>n.appendChild(figure(n.dataset.tfig,1)));
  box.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>{DB.load[b.dataset.next]=b.dataset.c;save();renderTune(sess);}));
  box.querySelectorAll('[data-ban]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.ban,on=!isBanned(k);setBan(k,on);b.setAttribute('aria-pressed',String(on));const n=box.querySelector(`[data-bannote="${k}"]`);if(n)n.hidden=!on;}));
  if(ks.some(isBanned))d.open=true;
  box.querySelectorAll('[data-tune]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.tune, prev=sess.tuned[k];
    const f={less:.88,ok:1,more:1.12};
    let p=progOf(k); if(prev) p=p/f[prev]; p=Math.min(2,Math.max(.5,Math.round(p*f[b.dataset.v]*100)/100));
    DB.prog[k]=p; sess.tuned[k]=b.dataset.v; setCap(sess); save(); showLevelHint();
    box.querySelectorAll(`[data-tune="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));
  box.querySelectorAll('[data-kg]').forEach(i=>i.addEventListener('change',()=>{const v=parseFloat(String(i.value).replace(',','.'));
    if(isFinite(v)&&v>0)DB.load[i.dataset.kg]=`${v} kg`; else delete DB.load[i.dataset.kg]; save();}));
  box.querySelectorAll('[data-band]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.band;DB.load[k]=b.dataset.c;save();
    box.querySelectorAll(`[data-band="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));
}
function rate(key){
  const sess=lastSess; if(!sess||sess.rating)return;
  const r=RATING[key]; sess.rating=key;
  (sess.ex||[]).filter(ex=>EX[ex]&&EX[ex].region!=='mobility').forEach(ex=>{DB.prog[ex]=Math.min(2,Math.max(.5,Math.round(progOf(ex)*r.f*100)/100));});
  setCap(sess); save(); remoteAddSession(sess); showLevelHint();
  $('d-rate').querySelectorAll('button').forEach(x=>{x.setAttribute('aria-pressed',String(x.dataset.rate===key));x.disabled=true;});
  $('d-rnote').textContent=r.msg;
}
function releaseWake(){try{wake&&wake.release();}catch(e){}wake=null;}
function closePlayer(){if(P){clearInterval(P.timer);P=null;}releaseWake();$('player').hidden=true;$('player').classList.remove('mode-gate','mode-rest','mode-ready','has-load');document.body.style.overflow='';$('p-stage').querySelectorAll(':scope>svg,:scope>.nofig').forEach(n=>n.remove());route();}

$('p-main').addEventListener('click',()=>{if(P&&!P.paused)next('manual');});
document.querySelectorAll('#d-rate [data-rate]').forEach(b=>b.addEventListener('click',()=>rate(b.dataset.rate)));
let quitArmed=false, quitTimer=null;
/* Top bar: running = [Pause] clock [Nächste]; paused = [Abbrechen] clock [Weiter] */
function updateTopButtons(){if(!P)return;
  $('p-quit').textContent=P.paused?(quitArmed?'Wirklich?':'Abbrechen'):'Pause';
  $('p-pause').textContent=P.paused?'Weiter':'Nächste';}
function togglePause(){if(!P)return;
  if(P.paused){const d=performance.now()-P.pauseAt;P.pausedTotal+=d;P.paused=false;live.forEach(f=>f.t0+=d);}
  else{P.paused=true;P.pauseAt=performance.now();}
  quitArmed=false;clearTimeout(quitTimer);
  $('p-main').disabled=P.paused;$('p-main').style.opacity=P.paused?.5:1;updateTopButtons();}
function skipStep(){if(!P)return;const s=P.steps[P.i];
  if(s.type==='work'){if(s.reps)P.reps-=s.reps;P.skipped=(P.skipped||0)+1;P.skipNow=true;}
  goTo(P.i+1);}
$('p-quit').addEventListener('click',()=>{if(!P)return;
  if(!P.paused){guidePaused=false;togglePause();return;}
  if(!quitArmed){quitArmed=true;updateTopButtons();clearTimeout(quitTimer);quitTimer=setTimeout(()=>{quitArmed=false;updateTopButtons();},3000);return;}
  quitArmed=false;closePlayer();});
$('p-pause').addEventListener('click',()=>{if(!P)return;
  if(P.paused){guidePaused=false;togglePause();} else skipStep();});
$('p-guide').addEventListener('click',()=>{const ex=guideEx();if(!ex)return;if(P&&!P.paused){togglePause();guidePaused=true;}openSheet(ex);});
$('d-close').addEventListener('click',closePlayer);
addEventListener('keydown',e=>{if(!$('player').hidden&&P&&(e.code==='Space'||e.key==='Enter')&&document.activeElement===document.body){e.preventDefault();$('p-main').click();}});
document.addEventListener('visibilitychange',()=>{if(!P)return;if(document.visibilityState==='hidden')P.stepHidden=true;else requestWake();});

ensureSeeds();
pruneMissing();
pairInit();
route();
syncInit();
</script>
